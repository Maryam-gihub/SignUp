<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">


</head>
</head>

<body>
    <div class="pt- d-flex mt-0 ">
        <div class="color pt-5 text-center">
            <h1>WELCOME BACK </h1>
        </div>
        <div class="bg-light text-dark  p-4 col-10 col-lg-6 border">
            <h2 class="button text-center animate__animated  animate__fadeIn">Sign In</h2>
            <div class="button">Email</div>
            <input type="email" id="email" class="form-control shadow-none my-ig-3 my-2" placeholder="Enter your email">
            <div class="button ">Password</div>
            <input type="password" id="Password" class="form-control shadow-none my-ig-3 my-2 my-2"
                placeholder="Enter Your password">
            <button onclick="" id="btnSubmit"
                class="btn btn-primary my-ig-3 my-2 w-10 text-center d-grid gap-2 col-6  mx-auto mt-5 animate__animated animate__rubberBand">Submit</button>

        </div>
    </div>


    <script>
        function toast(message = 'wWelcome', color = 'skyblue', duration = 1000) {
            Toastify({
                text: message,
                duration: duration,
                destination: "https://github.com/apvarun/toastify-js",
                newWindow: true,
                close: true,
                gravity: "top",
                position: "center",
                stopOnFocus: true,
                style: {
                    background: color,
                },
                onClick: function () { }
            }).showToast();
        }
        // let student = JSON.parse(localStorage.getItem('data')) || []
        const btn = document.getElementById('btnSubmit')
        const mail = document.getElementById('email')
        const pass = document.getElementById('Password')

        btn.addEventListener('click', () => {
            if (mail.value === '' || pass.value === '') {
                toast('fill in the empty space')
            }
            else {
                let gottenInfo = JSON.parse(localStorage.getItem('data'))
                console.log(gottenInfo);
                let user = gottenInfo.find(data => data.maily === mail.value && data.pin === pass.value)
                console.log(user);

                if (user) {
                    localStorage.setItem('signin', JSON.stringify('user'))
                    window.location.href = "dashboard.html"
                    mail.value = ''
                    pass.value = ''
                }
                else {
                    toast('Fill in the correct information')
                }
            }
        })

    </script>
</body>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</html>
