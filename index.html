<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>log in</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>

<body>

    <div class="pt- d-flex mt-0">
        <div class="mine pt-5 text-center text-white" >
            <h1 class="animate__animated  animate__swig">WELCOME </h1>
        </div>
        <div class="bg-light text-dark  p-4 col-10 col-lg-6 order">
            <h2 class="button text-center animate__animated  animate__swing ">Sign Up</h2>
            <div class="button">First Name</div>
            <input type="text" id="first" class="form-control shadow my-ig-3 my-2 text-capitalize"
                placeholder="Enter your first name">
            <div class="button">Last Name</div>
            <input type="text" id="last" class="form-control shadow my-ig-3 my-2 text-capitalize "
                placeholder="Enter your last name">
            <div class="button">Email</div>
            <input type="text" id="Email" class="form-control shadow my-ig-3 my-2"
                placeholder="Enter your email address">
            <div class="button">Password</div>
            <input type="password" id="Password" class="form-control shadow my-ig-3 my-2"
                placeholder="Enter a strong password">
            <button onclick="" id="btnSubmit"
                class="btn btn-primary my-ig-3 my-2 w-10 text-center d-grid gap-2 col-6  mx-auto mt-5 animate__animated animate__rubberBand">Submit</button>
        </div>
    </div>
    <script>
        function toast(message = 'wWelcome', color = 'skyblue', duration = 1000) {
            Toastify({
                text: message,
                duration: duration,
                destination: "https://github.com/apvarun/toastify-js",
                newWindow: true,
                close: true,
                gravity: "top",
                position: "center",
                stopOnFocus: true,
                style: {
                    background: color,
                },
                onClick: function () { }
            }).showToast();
        }

        let student = JSON.parse(localStorage.getItem('data')) || []
        const btn = document.getElementById('btnSubmit')
        const fName = document.getElementById('first')
        const lName = document.getElementById('last')
        const mail = document.getElementById('Email')
        const pass = document.getElementById('Password')

        btn.addEventListener('click', () => {

            if (fName.value === '' || lName.value === '' || mail.value === '' || pass.value === '') {
                toast('fill in the empty space')
            }
            else {
                console.log(fName.value, lName.value, mail.value, pass.value,);
                const obj = {
                    first: fName.value,
                    last: lName.value,
                    maily: mail.value,
                    pin: pass.value,
                }
                console.log(obj);
                student.push(obj)
                localStorage.setItem('data', JSON.stringify(student))
                setTimeout(() => {
                    window.location.href = 'Login.html'
                }, 1000)
                console.log(student);
                fName.value = ''
                lName.value = ''
                mail.value = ''
                pass.value = ''
            }
        })
    </script>
</body>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</html>
